version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend/src:/app/src  # Tylko src jest mapowane
      - /app/node_modules        # node_modules pozostaje w kontenerze
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Wymusza polling zmian plików
      - WATCHPACK_POLLING=true    # Dodatkowe ustawienie dla webpack
    command: npm run start
    depends_on:
      - backend
